alias: Warmtepomp koeling uit bij hoge stroomprijs
description: Zet de warmtepomp uit als de stroomprijs boven 0,50 komt en het vandaag warm is. Zakt de prijs een uur lang onder 0,50, dan gaat hij weer aan.
triggers:
  - alias: Prijs boven 0,50
    trigger: numeric_state
    entity_id:
      - sensor.nordpool_kwh_nl_eur_4_10_0
    above: 0.5
    id: duur
    note: Nordpool met de all-in prijs uit de template, dus dezelfde schaal als Zonneplan. Per kwartier in plaats van per uur.
  - alias: Prijs een uur lang onder 0,50
    trigger: numeric_state
    entity_id:
      - sensor.nordpool_kwh_nl_eur_4_10_0
    below: 0.5
    id: goedkoop
    for:
      hours: 1
      minutes: 0
      seconds: 0
conditions: []
actions:
  - choose:
      - alias: 'Dure prijs en het wordt warm: warmtepomp uit'
        conditions:
          - condition: trigger
            id: duur
          - alias: Alleen als het vandaag boven 20 graden wordt
            condition: numeric_state
            entity_id: sensor.temperatuur_verwachting_1d
            above: 20
            note: Dagmaximum van vandaag. De helper pakt Buienradar en valt terug op KNMI, zodat een storing bij een van beide hem niet stillegt.
          - alias: Alleen als hij nu aan staat
            condition: state
            entity_id: select.ecoforest_ecoforest_warmtepomp
            state: Ingeschakeld
        sequence:
          - alias: Zet de warmtepomp uit
            action: select.select_option
            target:
              entity_id: select.ecoforest_ecoforest_warmtepomp
            data:
              option: Uit
          - alias: Stuur een melding
            action: notify.mobile_app_samsung_galaxy_s26_christian
            data:
              title: Warmtepomp koeling UIT
              message: Stroomprijs {{ trigger.to_state.state | float | round(3) }} €/kWh (boven 0,50) en dagmaximum {{ states('sensor.temperatuur_verwachting_1d') }} °C. Warmtepomp op 'Uit' gezet.
      - alias: 'Prijs weer normaal: warmtepomp aan'
        conditions:
          - condition: trigger
            id: goedkoop
          - alias: Alleen als wij hem hebben uitgezet
            condition: state
            entity_id: select.ecoforest_ecoforest_warmtepomp
            state: Uit
        sequence:
          - alias: Zet de warmtepomp weer aan
            action: select.select_option
            target:
              entity_id: select.ecoforest_ecoforest_warmtepomp
            data:
              option: Ingeschakeld
          - alias: Stuur een melding
            action: notify.mobile_app_samsung_galaxy_s26_christian
            data:
              title: Warmtepomp weer AAN
              message: Stroomprijs {{ trigger.to_state.state | float | round(3) }} €/kWh (onder 0,50). Warmtepomp weer op 'Ingeschakeld' gezet.
mode: single
