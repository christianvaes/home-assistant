alias: Accu dagplan en bijplan
description: |-
  Bepaalt hoeveel kwartieren de accu uit het net bijlaadt en in welke modus hij staat.

  BESLISREGEL, IN VOLGORDE:
  1. Wordt er nu bijgeladen op net | Dynamisch NOM | alleen daar werkt het laadblok
  2. Goedkoopste kwartier en accu komt niet vol uit zon | Alleen slim opladen
  3. Moet er vandaag niets meer bijgeladen worden | Nul op de meter
  4. Anders | Dynamisch NOM

  WAT DAT PER SITUATIE BETEKENT:
  - Zon over | accu komt vol uit zon | de zon vult de accu en dekt je huis | Nul op de meter
  - Zon over | goedkoopste kwartier | accu komt niet vol | de zon vult de accu en je huis koopt het tekort in | Alleen slim opladen
  - Geen zon | goedkoopste kwartier | accu komt niet vol | je huis koopt in en de accu blijft gespaard voor een duurder moment | Alleen slim opladen
  - Geen zon | goedkoopste kwartier | dit kwartier laadt bij op net | de accu laadt uit het net en je huis koopt zelf in | Dynamisch NOM
  - Geen zon | dure prijs | de accu levert aan je huis | Nul op de meter of Dynamisch NOM

  BEGRIPPEN:
  - accu vol uit zon | de zon levert vandaag genoeg om de accu helemaal te vullen | er hoeft niets uit het net bij
  - bijladen op net | dit kwartier is door het package aangewezen om de accu uit het net te laden
  - goedkoopste kwartier | de prijs ligt onder de laagste van vandaag gedeeld door je rendement | en onder het daggemiddelde | op een vlakke dag bestaat er dus geen dal

triggers:
  - alias: Avond, plan voor morgen
    trigger: time
    at: "23:01:00"
    id: avond
    note: Prijzen voor morgen zijn dan bekend. Op :01 zodat het niet botst.

  - alias: Dag, bijstellen op de werkelijke zon
    trigger: time_pattern
    hours: /1
    minutes: 5
    id: dag
    note: Op :05 zodat het niet botst met de modustak.

  - alias: Modus tegen de actuele prijs houden
    trigger: time_pattern
    minutes: /15
    id: modus
    note: Zo vaak verandert de prijs.

variables:
  accu_inhoud: 13.92                # kWh totaal
  soc_minimum: 10                   # gelijk aan het input_number van het package
  accu_ruimte_leeg: >-              # bruikbare kWh, afgeleid uit de twee hierboven
    {{ accu_inhoud * (100 - soc_minimum) / 100 }}
  laadvermogen_per_kwartier: 0.53   # kWh per kwartier, gemeten
  zon_naar_accu_deel: 0.55          # deel van de zon dat de accu haalt
  zon_basislast: 1.5                # kWh aftrek bij weinig zon
  laadkwartieren_maximaal: 32       # acht uur
  rendement: 0.87                   # round trip, iets onder de gemeten 87,6 procent

actions:
  - choose:

      # ==================================================================
      # AVOND: hoeveel moet er morgen uit het net bij?
      # ==================================================================
      - alias: Avond, plan voor morgen
        conditions:
          - condition: trigger
            id: avond
        sequence:
          - variables:
              zon: >-                       # zonprognose voor morgen, kWh
                {{ states('sensor.solcast_pv_forecast_forecast_tomorrow') | float(0) }}
              zonoverschot: >-              # wat daarvan in de accu belandt, kWh
                {{ [ zon_naar_accu_deel * zon - zon_basislast, 0 ] | max }}
              aan_te_vullen: >-             # rest die uit het net moet, kWh
                {{ [ accu_ruimte_leeg | float(0) - zonoverschot, 0 ] | max }}
              laadkwartieren: >-            # naar boven afgerond, halve kwartieren bestaan niet
                {{ (aan_te_vullen / laadvermogen_per_kwartier)
                   | round(3) | round(0, 'ceil') | int }}

          - alias: Schrijf het aantal laadkwartieren voor morgen
            action: input_number.set_value
            target:
              entity_id: input_number.dynamisch_goedkoopste_x_periode_morgen
            data:
              value: "{{ laadkwartieren }}"
            note: Ook een 0, anders blijft gisteren staan.

          - alias: Zet alvast de modus voor vannacht
            action: input_select.select_option
            target:
              entity_id: input_select.zendure_2400_ac_modus_selecteren
            data:
              option: "{{ 'Nul op de meter' if laadkwartieren == 0 else 'Dynamisch NOM' }}"

      # ==================================================================
      # DAG: bijstellen op de echte SoC en de bijgewerkte prognose
      # ==================================================================
      - alias: Dag, bijstellen op de werkelijke zon
        conditions:
          - condition: trigger
            id: dag
          - alias: Niet na zonsondergang
            condition: sun
            before: sunset
            note: Dan is de resterende prognose nul en koopt hij de accu vol.
        sequence:
          - variables:
              zon: >-                       # wat er vandaag nog aan zon komt, kWh
                {{ states('sensor.solcast_pv_forecast_forecast_remaining_today') | float(0) }}
              zonoverschot: >-              # wat daarvan in de accu belandt, kWh
                {{ [ zon_naar_accu_deel * zon - zon_basislast, 0 ] | max }}
              soc: >-                       # echte vulling, procent
                {{ states('sensor.zendure_2400_ac_laadpercentage') | float(soc_minimum) }}
              ruimte_in_accu: >-            # wat er nu nog in past, kWh
                {{ [ accu_inhoud * (100 - soc) / 100, 0 ] | max }}
              aan_te_vullen: >-             # rest die uit het net moet, kWh
                {{ [ ruimte_in_accu - zonoverschot, 0 ] | max }}
              verstreken: >-                # goedkope kwartieren die al afgelopen zijn
                {{ (state_attr('sensor.dynamisch_goedkoopste_periode','raw_today') or [])
                   | selectattr('goedkoop','eq','ja')
                   | selectattr('end','le', now().isoformat()) | list | count }}
              nodig: >-                     # kwartieren laden die nog nodig zijn
                {{ (aan_te_vullen / laadvermogen_per_kwartier)
                   | round(3) | round(0, 'ceil') | int }}
              laadkwartieren: >-            # plus de afgelopen kwartieren, begrensd op het maximum
                {{ [ nodig + verstreken, laadkwartieren_maximaal ] | min if nodig > 0 else 0 }}

          - alias: Alleen schrijven als het getal verandert
            condition: template
            value_template: >-
              {{ states('input_number.dynamisch_goedkoopste_x_periode') | float(-1)
                 != laadkwartieren }}
            note: De min 1 zorgt dat hij bij een leeg veld toch schrijft.

          - alias: Stel het aantal laadkwartieren voor vandaag bij
            action: input_number.set_value
            target:
              entity_id: input_number.dynamisch_goedkoopste_x_periode
            data:
              value: "{{ laadkwartieren }}"
            note: Ook verlagen, anders koop je in wat de zon gratis levert.

      # ==================================================================
      # MODUS: ontladen of inkopen, elk kwartier opnieuw bekeken
      # ==================================================================
      - alias: Modus tegen de actuele prijs houden
        conditions:
          - condition: trigger
            id: modus
        sequence:
          - variables:
              in_dal: >-                    # 999 als terugval: kapotte sensor is nooit dal
                {% set p = (state_attr('sensor.dynamisch_nordpool','raw_today') or [])
                           | map(attribute='value') | list | sort %}
                {% set prijs_nu = states('sensor.dynamisch_nordpool') | float(999) %}
                {{ p | count > 0
                   and prijs_nu < p | first / rendement
                   and prijs_nu < p | average }}
              laadkwartieren: >-            # na 23:00 telt het plan voor morgen
                {{ states('input_number.dynamisch_goedkoopste_x_periode_morgen') | float(0)
                   if now().hour >= 23
                   else states('input_number.dynamisch_goedkoopste_x_periode') | float(0) }}

          - variables:
              gewenst: >-                   # de vier regels uit de beschrijving
                {{ 'Dynamisch NOM' if is_state('sensor.dynamisch_goedkoopste_periode','Ja')
                   else 'Alleen slim opladen' if (in_dal and laadkwartieren > 0)
                   else 'Nul op de meter' if laadkwartieren == 0
                   else 'Dynamisch NOM' }}

          - alias: Alleen schakelen als de modus echt moet veranderen
            condition: template
            value_template: >-
              {{ states('input_select.zendure_2400_ac_modus_selecteren') != gewenst }}

          - alias: Zet de gewenste modus
            action: input_select.select_option
            target:
              entity_id: input_select.zendure_2400_ac_modus_selecteren
            data:
              option: "{{ gewenst }}"

mode: single
trace:
  stored_traces: 50
