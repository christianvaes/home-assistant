alias: Accu dagplan en bijplan
description: |-
  Bepaalt hoeveel kwartieren de accu uit het net bijlaadt en in welke modus hij staat.

  BESLISREGEL, IN VOLGORDE:
  1. Wordt er nu bijgeladen op net | Dynamisch NOM | alleen daar werkt het laadblok
  2. Goedkoopste kwartier en accu komt niet vol uit zon | Alleen slim opladen
  3. Moet er vandaag niets meer bijgeladen worden | Nul op de meter
  4. Anders | Dynamisch NOM

  WAT DAT PER SITUATIE BETEKENT:
  - Zon over | accu komt vol uit zon | de zon vult de accu en dekt je huis | Nul op de meter
  - Zon over | goedkoopste kwartier | accu komt niet vol | de zon vult de accu en je huis koopt het tekort in | Alleen slim opladen
  - Geen zon | goedkoopste kwartier | accu komt niet vol | je huis koopt in en de accu blijft gespaard voor een duurder moment | Alleen slim opladen
  - Geen zon | goedkoopste kwartier | dit kwartier laadt bij op net | de accu laadt uit het net en je huis koopt zelf in | Dynamisch NOM
  - Geen zon | dure prijs | de accu levert aan je huis | Nul op de meter of Dynamisch NOM

  BEGRIPPEN:
  - accu vol uit zon | de zon levert vandaag genoeg om de accu helemaal te vullen | er hoeft niets uit het net bij
  - bijladen op net | dit kwartier is door het package aangewezen om de accu uit het net te laden
  - goedkoopste kwartier | de prijs ligt onder de laagste van vandaag gedeeld door je rendement | en onder het daggemiddelde | op een vlakke dag bestaat er dus geen dal
  - nacht | zolang de zon onder is | dan plannen we alsof de accu bij zonsopgang leeg is, zodat goedkope nachtkwartieren nooit gemist worden; te veel kan niet, het package stopt op 100 procent | overdag rekenen we met wat er echt in zit

triggers:
  - alias: Avond, plan voor morgen
    trigger: time
    at: "23:01:00"
    id: avond
    note: Laat genoeg om vanavond nog op het plan van vandaag te draaien, vroeg genoeg om de modus vóór middernacht goed te hebben. Op :01 zodat het niet botst met de modustak op het hele uur.

  - alias: Dag, bijstellen op de werkelijke zon
    trigger: time_pattern
    hours: /1
    minutes: 5
    id: dag
    note: Op :05 zodat het niet botst met de modustak.

  - alias: Modus tegen de actuele prijs houden
    trigger: time_pattern
    minutes: /15
    id: modus
    note: Zo vaak verandert de prijs.

variables:
  # ---- aan te passen aan jouw situatie ----
  rendement: 0.87                   # round trip, iets onder de bij mij gemeten 87,6 procent; het package heeft er een sensor voor
  zon_naar_accu_deel: 0.55          # deel van de zonnestroom dat het huis overdag niet zelf gebruikt en naar de accu gaat; bij mij 55 procent, teruglevering gedeeld door opwek
  zon_basislast: 1.5                # kWh zonnestroom per dag die het huis eerst zelf opmaakt, pas daarna gaat er iets naar de accu; bij mij 1,5
  zon_zekerheid: 0.9                # veiligheidsmarge: reken met 90 procent van de Solcast-prognose, want die valt vaker tegen dan mee; lager is meer marge en koopt vaker zon in die je gratis had gehad

  # ---- waarden uit het Zendure zenSDK-package van Gielz1986, met mijn waarden als terugval als een sensor wegvalt ----
  accu_inhoud: >-                   # totale inhoud van de accu in kWh
    {{ states('sensor.zendure_2400_ac_totale_capaciteit') | float(13.92) }}
  soc_minimum: >-                   # laagste percentage waartoe het package de accu laat leeglopen
    {{ states('input_number.zendure_2400_ac_minimaal_toegestaan_laadpercentage') | float(10) }}
  soc_maximum: >-                   # hoogste percentage waartoe het package de accu laat vollopen
    {{ states('input_number.zendure_2400_ac_maximaal_toegestaan_laadpercentage') | float(100) }}
  laadvermogen_per_kwartier: >-     # kWh die er in een kwartier laden echt bijkomt: laadvermogen in kW, maal rendement, gedeeld door vier
    {{ (states('input_number.zendure_2400_ac_max_oplaadvermogen') | float(2400) / 1000)
       * rendement / 4 }}

  # ---- hoeveel er in de accu past op het moment dat de zon weer schijnt ----
  soc: >-                           # hoe vol de accu nu is, in procenten
    {{ states('sensor.zendure_2400_ac_laadpercentage') | float(soc_minimum) }}
  ruimte_in_accu: >-                # hoeveel kWh er nog in de accu bij kan. Overdag: de echte ruimte van nu. 's Nachts: de hele accu, alsof hij bij zonsopgang leeg is; zo mist hij nooit goedkope nachtkwartieren, en te veel kan niet want het package stopt op 100 procent
    {{ accu_inhoud * (soc_maximum - soc_minimum) / 100
       if is_state('sun.sun','below_horizon')
       else [ accu_inhoud * (soc_maximum - soc) / 100, 0 ] | max }}

  # ---- hoeveel er dan nog uit het net bij moet ----
  zon: >-                           # Solcast-prognose in kWh met de marge erop: 's avonds die voor morgen, anders die voor de rest van vandaag
    {{ (states('sensor.solcast_pv_forecast_forecast_tomorrow') | float(0)
        if trigger.id == 'avond'
        else states('sensor.solcast_pv_forecast_forecast_remaining_today') | float(0))
       * zon_zekerheid }}
  zonoverschot: >-                  # hoeveel kWh daarvan in de accu terechtkomt
    {{ [ zon_naar_accu_deel * zon - zon_basislast, 0 ] | max }}
  aan_te_vullen: >-                 # hoeveel kWh er dan nog uit het net bij moet
    {{ [ ruimte_in_accu - zonoverschot, 0 ] | max }}
  nodig: >-                         # aantal kwartieren laden uit het net, naar boven afgerond
    {{ (aan_te_vullen / laadvermogen_per_kwartier) | round(3) | round(0, 'ceil') | int }}

actions:
  - choose:

      # ==================================================================
      # AVOND: schrijf het plan voor morgen
      # ==================================================================
      - alias: Avond, plan voor morgen
        conditions:
          - condition: trigger
            id: avond
        sequence:
          - alias: Schrijf het aantal laadkwartieren voor morgen
            action: input_number.set_value
            target:
              entity_id: input_number.dynamisch_goedkoopste_x_periode_morgen
            data:
              value: "{{ nodig }}"
            note: Ook een 0 wordt geschreven, anders blijft het getal van gisteren staan.

      # ==================================================================
      # DAG: stel het plan van vandaag elk uur bij
      # ==================================================================
      - alias: Dag, bijstellen op de werkelijke zon
        conditions:
          - condition: trigger
            id: dag
          - alias: Niet na zonsondergang
            condition: sun
            before: sunset
            note: Na zonsondergang is de Solcast-prognose voor de rest van de dag nul, dan zou hij de hele accu uit het net kopen.
        sequence:
          - variables:
              laadkwartieren: >-            # het aantal kwartieren dat we aan het package doorgeven; het package wijst dan de zoveel goedkoopste kwartieren van de dag aan om in te laden
                {# het package telt daarbij ook kwartieren mee die al voorbij zijn, dus we tellen van goedkoop naar duur door tot er 'nodig' kwartieren tussen zitten die nog komen #}
                {# kwartieren duurder dan het daggemiddelde doen nooit mee: laden kost dan meer dan het 's avonds oplevert #}
                {% set prijzen = state_attr('sensor.dynamisch_goedkoopste_periode','raw_today') or [] %}
                {% set gemiddelde = prijzen | map(attribute='value') | average if prijzen else 0 %}
                {# twee tellers in een namespace, want een gewone variabele die je in een for-lus ophoogt blijft buiten de lus niet staan #}
                {% set ns = namespace(x=0, toekomst=0) %}
                {% for q in prijzen | sort(attribute='value') if ns.toekomst < nodig and q.value < gemiddelde %}
                  {% set ns.x = ns.x + 1 %}
                  {% if (q.end | as_datetime) > now() %}{% set ns.toekomst = ns.toekomst + 1 %}{% endif %}
                {% endfor %}
                {{ ns.x if nodig > 0 else 0 }}

          - alias: Stel het aantal laadkwartieren voor vandaag bij
            action: input_number.set_value
            target:
              entity_id: input_number.dynamisch_goedkoopste_x_periode
            data:
              value: "{{ laadkwartieren }}"
            note: Ook verlagen, anders koop je in wat de zon gratis levert.

      # ==================================================================
      # MODUS: ontladen of inkopen, elk kwartier opnieuw bekeken
      # ==================================================================
      - alias: Modus tegen de actuele prijs houden
        conditions:
          - condition: trigger
            id: modus
        sequence:
          - variables:
              in_dal: >-                    # is dit nu een goedkoopste kwartier zoals in de beschrijving; een kapotte sensor geeft 999 en telt dus nooit als goedkoop
                {% set p = (state_attr('sensor.dynamisch_nordpool','raw_today') or [])
                           | map(attribute='value') | list | sort %}
                {% set prijs_nu = states('sensor.dynamisch_nordpool') | float(999) %}
                {{ p | count > 0
                   and prijs_nu < p | first / rendement
                   and prijs_nu < p | average }}
              plan: >-                      # het aantal laadkwartieren dat nu geldt: vanaf 23:01 dat van morgen, daarvoor dat van vandaag
                {{ states('input_number.dynamisch_goedkoopste_x_periode_morgen') | float(0)
                   if now() >= today_at('23:01')
                   else states('input_number.dynamisch_goedkoopste_x_periode') | float(0) }}
              gewenst: >-                   # de modus volgens de vier regels uit de beschrijving
                {{ 'Dynamisch NOM' if is_state('sensor.dynamisch_goedkoopste_periode','Ja')
                   else 'Alleen slim opladen' if (in_dal and plan > 0)
                   else 'Nul op de meter' if plan == 0
                   else 'Dynamisch NOM' }}

          - alias: Zet de modus
            action: input_select.select_option
            target:
              entity_id: input_select.zendure_2400_ac_modus_selecteren
            data:
              option: "{{ gewenst }}"

mode: single
trace:
  stored_traces: 50
