alias: Boiler verhogen zonoverschot
description: |-
  Versie 20261115 · https://github.com/christianvaes/home-assistant

  Energie management in het Eplucon-portaal zet de boiler op 45 graden in dure uren en op 58 in de goedkoopste uren. Deze automation verhoogt die 58 naar 65:
  - bij zonoverschot: er is meer zon over dan de boiler trekt;
  - bij een negatieve terugleverprijs: ook als er minder zon over is dan de boiler trekt, want die zon terugleveren kost dan geld; de rest komt uit de accu of het net;
  - bij een negatieve inkoopprijs: ook zonder zon, want je krijgt geld toe.
  Terug naar 58 als het zonoverschot weg is en de terugleverprijs niet meer negatief is. De 45 blijft altijd staan.
trigger_variables:
  prijssensor: sensor.nordpool_kwh_nl_eur_4_10_0            # wat je per kWh betaalt: marktprijs plus btw, energiebelasting en opslag
  terugleverprijssensor: sensor.nordpool_kwh_nl_eur_5_10_0  # wat je per kWh krijgt voor teruglevering; negatief als het geld kost
  start_vanaf: 2400                                         # naar 65 als er meer dan zoveel W zon over is; net boven de 2177 W die de boiler trekt
  start_vanaf_bij_negatieve_terugleverprijs: 1000           # hetzelfde, maar als de terugleverprijs negatief is
  terug_onder: 2200                                         # terug naar 58 onder zoveel W zon, tenzij de terugleverprijs negatief is; lager dan start_vanaf, zodat hij niet heen en weer springt
triggers:
  - alias: Genoeg zonoverschot
    trigger: template
    value_template: |-
      {% set op_58 = states('number.ecoforest_ecoforest_ww_ingestelde_temp_ww') | float(0) == 58 %}
      {% set overschot = states('sensor.warmtepomp_groep_electric_consumption_w') | float(0)
                       - states('sensor.p1_meter_5c2faf108f1e_actueel_vermogen') | float(0)
                       - states('sensor.zendure_2400_ac_vermogen_export') | float(0) %}
      {{ op_58 and overschot > start_vanaf }}
    for:
      minutes: 15
    id: zonoverschot
    note: Alleen als de boiler op 58 staat, dus nooit in de dure uren. Dat staat in de trigger en niet in de actie, zodat hij ook start als de reden er al was voordat de boiler naar 58 ging. Zon over is de teruglevering (min P1) plus wat de warmtepomp trekt, zodat het getal niet verspringt als de boiler aangaat, min wat de accu ontlaadt. Vijftien minuten, zodat een opklaring hem niet start.

  - alias: Terugleverprijs negatief en genoeg zonoverschot
    trigger: template
    value_template: |-
      {% set op_58 = states('number.ecoforest_ecoforest_ww_ingestelde_temp_ww') | float(0) == 58 %}
      {% set overschot = states('sensor.warmtepomp_groep_electric_consumption_w') | float(0)
                       - states('sensor.p1_meter_5c2faf108f1e_actueel_vermogen') | float(0)
                       - states('sensor.zendure_2400_ac_vermogen_export') | float(0) %}
      {% set terugleverprijs = states(terugleverprijssensor) | float(0) %}
      {{ op_58 and terugleverprijs < 0 and overschot > start_vanaf_bij_negatieve_terugleverprijs }}
    for:
      minutes: 10
    id: negatieve terugleverprijs
    note: Een onbekende terugleverprijs telt als 0, dus niet als negatief. Tien minuten, zodat de vaatwasser-automation, die na acht minuten teruglevering start, voorgaat.

  - alias: Inkoopprijs negatief
    trigger: template
    value_template: |-
      {% set op_58 = states('number.ecoforest_ecoforest_ww_ingestelde_temp_ww') | float(0) == 58 %}
      {{ op_58 and states(prijssensor) | float(0) < 0 }}
    id: negatieve inkoopprijs
    note: Geen wachttijd, de prijs staat per kwartier vast. Een onbekende prijs telt als 0, dus niet als negatief.

  - alias: Boiler staat op onze 65, het zonoverschot is weg en de terugleverprijs is niet meer negatief
    trigger: template
    value_template: |-
      {% set verhoogd = states('number.ecoforest_ecoforest_ww_ingestelde_temp_ww') | float(0) == 65 %}
      {% set overschot = states('sensor.warmtepomp_groep_electric_consumption_w') | float(0)
                       - states('sensor.p1_meter_5c2faf108f1e_actueel_vermogen') | float(0)
                       - states('sensor.zendure_2400_ac_vermogen_export') | float(0) %}
      {% set terugleveren_kost_geld = states(terugleverprijssensor) | float(0) < 0 %}
      {{ verhoogd and overschot < terug_onder and not terugleveren_kost_geld }}
    for:
      minutes: 20
    id: terugzetten
    note: Alleen onze eigen 65, nooit de 45 of 58 van de warmtepomp. Een negatieve inkoopprijs houdt hem ook op 65, want dan is de terugleverprijs ook negatief. Een onbekende prijs telt als 0, dan zet hij gewoon terug. Twintig minuten, zodat een wolk hem niet meteen terugzet.
actions:
  - choose:
      - alias: Reden om te verhogen
        conditions:
          - condition: trigger
            id:
              - zonoverschot
              - negatieve terugleverprijs
              - negatieve inkoopprijs
        sequence:
          - alias: Verhoog de boiler naar 65 graden
            action: number.set_value
            target:
              entity_id: number.ecoforest_ecoforest_ww_ingestelde_temp_ww
            data:
              value: 65
          - alias: Stuur een melding dat de boiler omhoog gaat, met de reden
            action: notify.mobile_app_samsung_galaxy_s26_christian
            data:
              title: Boiler omhoog op {{ trigger.id }}
              message: >-
                {% if trigger.id != 'negatieve inkoopprijs' %}Overschot {{ (states('sensor.warmtepomp_groep_electric_consumption_w') | float(0) - states('sensor.p1_meter_5c2faf108f1e_actueel_vermogen') | float(0) - states('sensor.zendure_2400_ac_vermogen_export') | float(0)) | round(0) }} W.
                {% endif %}Boiler van 58 naar 65 graden.

      - alias: Geen reden meer en de boiler staat op onze 65
        conditions:
          - condition: trigger
            id: terugzetten
        sequence:
          - alias: Zet de boiler terug op 58 graden
            action: number.set_value
            target:
              entity_id: number.ecoforest_ecoforest_ww_ingestelde_temp_ww
            data:
              value: 58
mode: single
