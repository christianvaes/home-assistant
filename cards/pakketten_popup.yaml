    hide_main_background: true
    rows: 0.75
    visibility:
      - condition: numeric_state
        entity: sensor.postnl_jouw_account_brieven
        above: 0
    sub_button:
      bottom:
        - group:
            - entity: sensor.postnl_jouw_account_brieven
              name: "Brieven · {{ states(entity) }}"
              state_content: "{{ (state_attr(entity, 'letters') or []) | map(attribute='title') | join(', ') }}"
              icon: mdi:email
              show_name: true
              state_background: false
              css_class: brief
              tap_action:
                action: none                    # een brief heeft geen trackpagina
